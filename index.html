  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script>
    /* 테마 적용은 Firebase 모듈이 아니라 여기서 한다.
       모듈은 gstatic import 해석까지 실행이 지연되고, 사내망에서 차단되면 아예 실행되지 않는다. */
    (function () {
      var r = document.documentElement, s = null;
      try { s = localStorage.getItem("theme"); } catch (e) {}
      if (s) r.dataset.theme = s;
      else if (matchMedia("(prefers-color-scheme:dark)").matches) r.dataset.theme = "dark";
      /* 토글도 여기서 위임 처리한다. 모듈에 두면 gstatic 차단 시 버튼이 죽는다. */
      document.addEventListener("click", function (e) {
        var b = e.target && e.target.closest && e.target.closest("#theme-toggle");
        if (!b) return;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("theme", r.dataset.theme); } catch (err) {}
      });

      /* 부팅 감시견.
         앱 모듈은 gstatic에서 Firebase SDK를 가져온다. 학교·사내망이 그 도메인을 막으면
         모듈 본문이 한 줄도 실행되지 않아, 예전에는 헤더만 남은 빈 화면이 됐다.
         모듈이 살아 있으면 __boardBooted를 세우므로, 안 세워졌으면 여기서 이유를 알린다. */
      setTimeout(function () {
        if (window.__boardBooted) return;
        var el = document.getElementById("bootBanner");
        if (el) el.classList.remove("hidden");
      }, 6000);
    })();
  </script>
  <style>
    /* ==========================================================================
       PORTABLE: TOKENS + PRIMITIVES
       source: sehunYang.github.io/css/main.css (대조 2026-07-28)
       다른 프로젝트로 디자인을 통일할 때는 이 블록만 복사하면 출발점이 됩니다.
       아래 "APP-SPECIFIC" 구획 위쪽까지가 이식 대상입니다.

       ⚠️ 기준과의 의도적 이탈 — .button
          기준의 .button은 accent 채움(filled)입니다.
          이 파일은 .button을 기존 버튼 7곳에 "덧붙이는" 방식이라, 채움을 그대로 쓰면
          칩·삭제·자세히까지 전부 accent 파랑이 됩니다.
          그래서 여기서는  .button = 중립(outlined),  채움은 .btn-primary 가 담당합니다.
          → 이 블록을 기준 사이트의 마크업과 함께 쓰지 마세요. 버튼이 잘못 보입니다.
          → 장기적으로는 양쪽을 .button=채움 / .button.ghost=중립 으로 맞추는 것이 맞습니다.

       ⚠️ .button 과 .btn-primary 는 CSS 특이성이 같습니다(0,1,0).
          반드시 이 PORTABLE 블록이 APP-SPECIFIC 보다 "앞"에 와야 합니다.
       ========================================================================== */
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --text: #171717;
      --muted: #666666;
      --line: #d9d9d4;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #111210;
      --surface: #191a18;
      --text: #f2f2ed;
      --muted: #a8aaa2;
      --line: #343630;
      --accent: #7db1ff;
      --accent-soft: #172a46;
    }

    * { box-sizing: border-box; }
    html {
      /* 기준 사이트의 본문 스케일 17px. body가 아니라 html에 지정해야 한다 —
         이 파일의 크기 선언은 전부 rem이고 rem은 루트 기준이다. */
      font-size: 17px;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.7;
      letter-spacing: -0.01em;
      -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3 { line-height: 1.2; letter-spacing: -0.04em; }
    button { font: inherit; }

    /* --- 프리미티브: 버튼 (기준 main.css의 .button / .icon-button) --- */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .button.secondary { background: var(--surface); color: var(--accent); }
    .icon-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      width: 2.5rem;
      height: 2.5rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* --- 프리미티브: 안내 박스 (기준 main.css의 .notice) --- */
    .notice {
      padding: 1rem;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      color: var(--text);
    }

    /* --- 프리미티브: 토스트 (기준 main.css의 .toast) --- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      z-index: 30;
      translate: -50% 1rem;
      max-width: calc(100vw - 2rem);
      padding: 0.75rem 1.15rem;
      /* 기준은 999px pill이지만 이 앱의 토스트는 복사한 글 미리보기(2줄)를 담는다.
         다줄 콘텐츠와 pill 곡률은 기하학적으로 맞지 않아 14px로 의도적 이탈. */
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, translate 0.2s ease;
    }
    .toast.is-visible { opacity: 1; translate: -50% 0; }

    /* --- 프리미티브: 포커스 링 --- */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ==========================================================================
       APP-SPECIFIC (강의 보드 전용)
       아래부터는 이식 대상이 아닙니다.
       주의: 이 구획은 반드시 PORTABLE 블록 "뒤"에 와야 합니다.
             .button과 .btn-primary는 특이성이 같아(0,1,0) 순서가 승자를 정합니다.
             순서가 뒤집히면 저장 버튼이 회색으로 보이는 무증상 회귀가 납니다.
       ========================================================================== */
    :root {
      /* 기준 토큰 집합에는 없지만 현행 파일에서 승계하는 값 (신규 발명 아님).
         #dc2626 on #ffffff = 4.83:1 (AA 통과) — 라이트는 원값을 그대로 유지한다.
         다크에서는 #dc2626 on #191a18 = 3.62:1 로 AA 실패하므로 아래에서 분리한다. */
      --danger: #dc2626;
      /* accent 위에 얹는 글자색. 기준의 .button{color:#fff}를 그대로 쓰면
         다크에서 #fff on #7db1ff = 2.19:1 로 AA 실패하므로 분리한다.
         라이트 #fff on #2563eb = 5.17:1 / 다크 #111210 on #7db1ff = 8.59:1 */
      --on-accent: #ffffff;
      --bubble-hidden-opacity: 0.55;
    }
    [data-theme="dark"] {
      /* #dc2626 on #191a18 = 3.62:1 (AA 실패) → #f87171 = 6.31:1 */
      --danger: #f87171;
      --on-accent: #111210;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem 1rem 5rem;
    }

    /* Header — 기준 .site-header 를 따라 full-bleed sticky.
       .wrap 안에 두면 폭이 820px로 갇혀 블러 패널과 하단선이 화면 중간에서 끊긴다. */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem max(1rem, calc((100vw - 820px) / 2));
      /* color-mix 미지원 브라우저에서는 아래 선언이 파싱 단계에서 폐기되어
         transparent가 되므로, 불투명 폴백을 먼저 선언한다. */
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .site-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
      color: var(--text);
    }
    .site-header .header-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    button {
      /* font-family는 위 PORTABLE의 button{font:inherit}가 이미 처리한다. */
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.95rem;
      padding: 0.45rem 0.9rem;
      background: var(--surface);
      color: var(--text);
      transition: background 0.12s ease, opacity 0.12s ease, border-color 0.12s ease;
    }
    button:hover {
      background: var(--bg);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    button:active { opacity: 0.8; }
    .btn-mode { background: var(--surface); color: var(--accent); font-weight: 700; }
    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      font-weight: 700;
    }
    .btn-primary:hover {
      background: var(--accent);
      background: color-mix(in srgb, var(--accent) 85%, var(--text));
    }
    .btn-danger { color: var(--danger); background: var(--surface); }

    /* Banner — 기준 .notice 패턴 */
    .banner {
      border-radius: 0 10px 10px 0;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
    }
    /* accent on accent-soft은 라이트에서 4.24:1로 AA 미달 — .btn-more와 동일하게 처리한다.
       라이트 #2563eb on #ffffff = 5.17:1 / 다크 #7db1ff on #191a18 = 7.99:1 */
    .banner code {
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .hidden { display: none !important; }

    /* 수업 종류 바 */
    .classbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .classbar .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .chip {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--line);
    }
    .chip:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    /* 선택 상태: 기준의 .sim-tab[aria-selected=true] 패턴(accent-soft + accent 테두리).
       inset 그림자로 테두리를 2px 두께처럼 보이게 해 교실 뒤에서도 식별되게 한다(P3). */
    .chip.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      font-weight: 700;
    }
    .chip.active:hover { background: var(--accent-soft); }
    .classbar .cb-tools { display: flex; gap: 0.25rem; margin-left: auto; }
    .classbar .cb-tools button {
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }
    .classbar .cb-tools button:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    .classbar .cb-add { color: var(--accent); font-weight: 700; }
    .class-label { font-size: 0.92rem; color: var(--muted); }
    .class-label b { color: var(--accent); font-weight: 700; }

    select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
    }

    /* Composer (teacher) */
    .composer { margin-bottom: 1.4rem; }
    .composer textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      font-family: inherit;
      font-size: 1.15rem;
      line-height: 1.5;
      padding: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
    }
    .composer .cat-row { display: flex; align-items: center; gap: 0.5rem; }
    .composer .cat-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .composer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }
    .bulk-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

    /* Bubbles */
    .list { display: flex; flex-direction: column; gap: 0.85rem; }
    .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
    }
    .bubble.is-hidden {
      border-style: dashed;
      opacity: var(--bubble-hidden-opacity);
    }
    /* 수강생 화면: 버블 전체가 복사 버튼 역할 */
    .bubble.copyable { cursor: pointer; }
    .bubble.copyable:hover { border-color: var(--accent); }
    .bubble.copyable:active { opacity: 0.85; }
    .bubble .content { flex: 1; min-width: 0; }
    .bubble .text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 1.5rem;
      line-height: 1.55;
      letter-spacing: -0.01em;
      user-select: text;
      -webkit-user-select: text;
    }
    /* 3줄 초과 시 ... 처리 */
    .bubble .text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* accent 글자를 accent-soft 위에 얹으면 라이트에서 4.24:1로 AA 미달이다.
       배경을 surface로 두고 테두리로 accent 정체성을 유지한다.
       라이트 #2563eb on #ffffff = 5.17:1 / 다크 #7db1ff on #191a18 = 7.99:1 */
    .bubble .btn-more {
      margin-top: 0.5rem;
      padding: 0.2rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
    }
    .bubble .btn-more:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    }
    .bubble .cat-tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
    }
    /* 수강생 화면의 복사 버튼. 버블 전체 클릭도 그대로 되지만,
       키보드·스크린리더에는 이 진짜 버튼이 유일한 경로다. */
    .bubble .btn-copy {
      flex-shrink: 0;
      align-self: flex-start;
      padding: 0.35rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
    }
    .bubble .btn-copy:hover { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .bubble .cat-select { margin-top: 0.55rem; font-size: 0.8rem; padding: 0.25rem 0.55rem; }
    .bubble .content-foot { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .bubble .num {
      flex-shrink: 0;
      min-width: 1.5em;
      text-align: right;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .bubble .time {
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .bubble .actions {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .bubble .actions button { padding: 0.35rem 0.75rem; font-size: 0.9rem; white-space: nowrap; }
    .bubble .reorder {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .bubble .reorder button {
      padding: 0.3rem 0.7rem;
      font-size: 1rem;
      line-height: 1;
      font-weight: 700;
    }
    .bubble .reorder button:disabled { opacity: 0.3; cursor: default; }
    .bubble.editing { flex-direction: column; }
    .bubble .edit-area {
      width: 100%;
      min-height: 90px;
      font-family: inherit;
      font-size: 1.4rem;
      line-height: 1.5;
      padding: 0.7rem;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }
    .bubble .edit-row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.6rem; width: 100%; }

    .empty { color: var(--muted); text-align: center; padding: 3rem 0; font-size: 1.05rem; }

    /* ── 코드 표시 모드 ────────────────────────────────────────────────
       강의 중 붙여넣는 명령어·코드를 읽기 쉽게 만든다.
       토큰 색은 accent 계열과 부딪히지 않도록 별도 토큰으로 둔다. */
    :root {
      --code-bg: #f4f4f0;
      --tok-str: #0a7d55;
      --tok-num: #9a4b00;
      --tok-key: #7c3aed;
      /* 주석도 읽히는 글자다. #8a8a80 on #f4f4f0 = 2.9:1 (AA 미달)
         → #6f6f66 = 4.5:1. 다크의 #7d8076 on #14150f 는 4.6:1로 이미 통과. */
      --tok-com: #6f6f66;
      --ind-1: rgba(37, 99, 235, 0.10);
      --ind-2: rgba(139, 92, 246, 0.10);
      --ind-3: rgba(16, 163, 127, 0.10);
      --ind-4: rgba(217, 119, 6, 0.10);
    }
    [data-theme="dark"] {
      --code-bg: #14150f;
      --tok-str: #6ed3a2;
      --tok-num: #e0a860;
      --tok-key: #c4a2ff;
      --tok-com: #7d8076;
      --ind-1: rgba(125, 177, 255, 0.13);
      --ind-2: rgba(196, 162, 255, 0.13);
      --ind-3: rgba(110, 211, 162, 0.13);
      --ind-4: rgba(224, 168, 96, 0.13);
    }

    .bubble .text.code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas,
                   "D2Coding", "Liberation Mono", Menlo, monospace;
      font-size: 1.12rem;
      line-height: 1.62;
      letter-spacing: 0;
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
    }
    /* 가로 스크롤은 펼친 상태에서만 의미가 있다.
       .clamped 는 overflow:hidden 으로 줄 수를 세므로 거기에 얹으면 죽은 선언이 된다. */
    .bubble .text.code:not(.clamped) { overflow-x: auto; }
    /* 코드는 3줄이면 너무 짧다 — 접힌 상태에서도 8줄까지 보여준다. */
    .bubble .text.code.clamped {
      -webkit-line-clamp: 8;
      line-clamp: 8;
    }

    .tok-str { color: var(--tok-str); }
    .tok-num { color: var(--tok-num); }
    .tok-key { color: var(--tok-key); font-weight: 600; }
    .tok-com { color: var(--tok-com); font-style: italic; }

    /* indent-rainbow: 들여쓰기 한 칸마다 색을 돌려 깊이를 눈으로 잡게 한다. */
    .ind { border-left: 2px solid transparent; }
    .ind-0 { background: var(--ind-1); border-left-color: color-mix(in srgb, var(--tok-key) 35%, transparent); }
    .ind-1 { background: var(--ind-2); border-left-color: color-mix(in srgb, var(--tok-str) 35%, transparent); }
    .ind-2 { background: var(--ind-3); border-left-color: color-mix(in srgb, var(--tok-num) 35%, transparent); }
    .ind-3 { background: var(--ind-4); border-left-color: color-mix(in srgb, var(--accent) 35%, transparent); }

    /* color highlight: #2563eb, rgb(...), hsl(...) 옆에 실제 색 견본을 붙인다. */
    .swatch {
      display: inline-block;
      width: 0.72em;
      height: 0.72em;
      margin-right: 0.28em;
      vertical-align: -0.04em;
      border: 1px solid var(--line);
      border-radius: 3px;
    }

    .bubble .code-tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
    }
    .composer .code-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .composer .code-row input { width: 1rem; height: 1rem; accent-color: var(--accent); }

    /* ── 강의자 도구 바 (방 이름 · 로그인 · 내보내기) ───────────────── */
    .teacher-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .teacher-bar .room-name {
      font-weight: 700;
      color: var(--text);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .teacher-bar .spacer { flex: 1; }
    .teacher-bar button { padding: 0.3rem 0.7rem; font-size: 0.82rem; }
    .uid-box {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
      word-break: break-all;
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      margin-top: 0.4rem;
    }

    /* ── 범용 입력/확인 다이얼로그 (prompt·confirm 대체) ────────────── */
    .ask-dialog { max-width: 26rem; }
    .ask-dialog .ask-msg { margin: 0 0 0.8rem; white-space: pre-wrap; line-height: 1.55; }
    .ask-dialog .ask-input {
      width: 100%;
      font: inherit;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }
    .ask-dialog .ask-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    /* 오류 토스트: 복사 성공 토스트와 같은 자리를 쓰되 색으로 구분한다. */
    .toast.is-error { border-color: var(--danger); }
    .toast.is-error .toast-msg { color: var(--danger); }

    /* 연결 끊김 표시 */
    .conn-warn {
      display: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--danger);
      white-space: nowrap;
    }
    .conn-warn.is-on { display: inline; }

    /* Profile editor (teacher only) */
    .profile-editor {
      margin-top: 2.2rem;
      padding: 0.7rem 1.1rem;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }
    .pf-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.35rem 0;
    }
    .pf-toggle:hover { background: transparent; opacity: 0.8; }
    .pf-toggle .pf-icon { font-size: 0.8rem; }
    .pf-body { margin-top: 0.7rem; }
    .profile-editor label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .profile-editor input,
    .profile-editor textarea {
      width: 100%;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
    }
    .profile-editor textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }
    .profile-editor .pe-row { display: flex; justify-content: flex-end; }

    /* Profile card (footer, everyone) */
    .profile-footer {
      margin-top: 2.4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }
    .profile-footer .pf-name { font-weight: 600; }
    .profile-footer .pf-contact-label { margin-top: 4px; font-weight: 600; }
    .profile-footer .pf-contact {
      white-space: pre-line;
      padding-left: 8px;
      border-left: 2px solid var(--line);
      margin-top: 2px;
    }
    .profile-footer .pf-copy { margin-top: 6px; font-size: 0.72rem; opacity: 0.9; }

    /* 강의자 비밀번호 다이얼로그 */
    .pw-dialog {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      padding: 1.5rem 1.6rem 1.3rem;
      min-width: min(21rem, calc(100vw - 2.5rem));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }
    .pw-dialog::backdrop { background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px); }
    .pw-title { font-size: 1.15rem; font-weight: 800; margin: 0 0 1rem; }
    .pw-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    .pw-input {
      width: 100%;
      font-family: inherit;
      font-size: 1.3rem;
      letter-spacing: 0.25em;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    .pw-error {
      min-height: 1.3rem;
      margin: 0.45rem 0 0;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--danger);
    }
    .pw-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.6rem; }

    /* Toast 내부 (복사 완료 알림) */
    .toast .toast-msg { display: block; font-size: 0.95rem; }
    .toast .toast-preview {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
      font-size: 0.8rem;
      opacity: 0.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 700px) {
      html { font-size: 16px; }
    }

    @media (max-width: 560px) {
      .bubble { flex-direction: row; flex-wrap: wrap; }
      .bubble .content { flex-basis: 100%; order: 2; }
      .bubble .text { font-size: 1.3rem; }
      .bubble .num { order: 1; }
      .bubble .time { order: 3; padding-top: 0; }
      .bubble .actions { order: 4; flex-direction: row; flex-wrap: wrap; }
      .bubble .reorder { order: 5; flex-direction: row; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 id="title">강의 보드</h1>
    <div class="header-tools">
      <span id="connWarn" class="conn-warn" role="status">연결 끊김</span>
      <button id="modeToggle" class="btn-mode button secondary">강의자 모드</button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="색상 모드 전환">◐</button>
    </div>
  </header>
  <div class="wrap">

    <div id="setupBanner" class="banner notice hidden">
      ⚠️ Firebase 설정이 아직 안 됐습니다. <code>index.html</code> 상단 <code>firebaseConfig</code> 값을
      본인 프로젝트 값으로 교체하세요. 방법은 <code>README.md</code> 참고.
    </div>

    <!-- 앱 모듈이 6초 안에 부팅하지 못하면 <head>의 감시견이 이 배너를 켠다.
         가장 흔한 원인은 학교·사내망의 gstatic.com 차단이다. -->
    <div id="bootBanner" class="banner notice hidden">
      ⚠️ 실시간 동기화 모듈을 불러오지 못했습니다.
      이 네트워크가 <code>gstatic.com</code>을 차단하고 있을 가능성이 큽니다.
      다른 네트워크(휴대폰 테더링 등)로 접속해 보세요.
    </div>


    <!-- 수업 종류 선택 바 (강의자: 선택·추가·수정, 수강생: 현재 수업 표시) -->
    <div id="classBar" class="classbar hidden"></div>

    <!-- 강의자 전용: 방 이름 · 로그인 · 백업 -->
    <div id="teacherBar" class="teacher-bar hidden">
      <span>보드</span>
      <span id="roomName" class="room-name">default</span>
      <span id="hideNote"></span>
      <span class="spacer"></span>
      <button id="exportBtn" type="button">내보내기</button>
      <button id="importBtn" type="button">불러오기</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
      <span id="authArea"></span>
    </div>

    <!-- 강의자 전용 작성 영역 -->
    <div id="teacherComposer" class="composer hidden">
      <textarea id="input" maxlength="4000" placeholder="여기에 글을 적고 저장하세요 (여러 줄 가능)"></textarea>
      <div class="composer-row">
        <div class="cat-row">
          <label for="msgCategory">수업 종류</label>
          <select id="msgCategory"></select>
        </div>
        <label class="code-row" for="msgCode">
          <input id="msgCode" type="checkbox" />
          <span>코드로 표시</span>
        </label>
        <button id="saveBtn" class="btn-primary button">저장</button>
      </div>
      <div class="bulk-row">
        <button id="hideAllBtn">모두 숨기기</button>
        <button id="showAllBtn">모두 보이기</button>
      </div>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty hidden">아직 표시된 글이 없습니다.</div>

    <!-- 강의자 전용 프로필 편집 (강의자 모드 맨 아래) -->
    <div id="profileEditor" class="profile-editor hidden">
      <button id="pfToggle" class="pf-toggle" type="button" aria-expanded="false" aria-controls="pfBody">
        <span>프로필 카드 편집</span>
        <span id="pfIcon" class="pf-icon">▸</span>
      </button>
      <div id="pfBody" class="pf-body hidden">
        <label for="pfName">이름</label>
        <input id="pfName" type="text" maxlength="80" placeholder="이름" autocomplete="off" />
        <label for="pfAffiliation">소속</label>
        <input id="pfAffiliation" type="text" maxlength="120" placeholder="소속" autocomplete="off" />
        <label for="pfContact">Contact (여러 줄 입력 가능 — SNS, 이메일 등)</label>
        <textarea id="pfContact" maxlength="600" placeholder="예)&#10;Email: name@example.com&#10;Instagram: @handle"></textarea>
        <div class="pe-row">
          <button id="pfSaveBtn" class="btn-primary button">프로필 저장</button>
        </div>
      </div>
    </div>

    <!-- 프로필 카드 (양쪽 화면 공통 푸터) -->
    <footer id="profileCard" class="profile-footer hidden"></footer>
  </div>

  <!-- 복사 완료 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <b class="toast-msg">복사되었습니다</b>
    <span id="toastPreview" class="toast-preview" aria-hidden="true"></span>
  </div>

  <!-- 강의자 비밀번호 입력 (화면 공유 중 노출 방지를 위해 type=password 사용) -->
  <dialog id="pwDialog" class="pw-dialog" aria-labelledby="pwTitle">
    <form id="pwForm" method="dialog">
      <h2 id="pwTitle" class="pw-title">강의자 모드</h2>
      <label class="pw-label" for="pwInput">비밀번호</label>
      <input id="pwInput" class="pw-input" type="password"
             autocomplete="current-password" placeholder="비밀번호" />
      <p id="pwError" class="pw-error" role="alert"></p>
      <div class="pw-actions">
        <button type="button" id="pwCancel" class="button">취소</button>
        <button type="submit" id="pwSubmit" class="btn-primary button">확인</button>
      </div>
    </form>
  </dialog>

  <!-- 범용 입력·확인 다이얼로그.
       window.prompt/confirm은 화면 송출 중에 브라우저 크롬 위로 떠서 보드와 따로 놀고,
       모바일에서는 특히 거슬린다. 비밀번호 다이얼로그와 같은 결로 통일한다. -->
  <dialog id="askDialog" class="pw-dialog ask-dialog" aria-labelledby="askTitle">
    <form id="askForm" method="dialog">
      <h2 id="askTitle" class="pw-title">확인</h2>
      <p id="askMsg" class="ask-msg"></p>
      <input id="askInput" class="ask-input" type="text" autocomplete="off" />
      <div class="ask-actions">
        <button type="button" id="askCancel" class="button">취소</button>
        <button type="submit" id="askOk" class="btn-primary button">확인</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    // 이 줄이 실행되면 모듈은 살아 있다 — <head>의 부팅 감시견을 끈다.
    // (SDK를 못 받아오는 경우는 아래에서 더 구체적인 배너로 따로 알린다.)
    window.__boardBooted = true;

    // ====== Firebase 설정 (본인 값으로 교체하세요 — README.md 참고) ======
    const firebaseConfig = {
      apiKey: "AIzaSyAKrNGCO-9vvtO6vM-NK_atwKl4OAmmtCw",
      authDomain: "lecture-dashboard-e3e86.firebaseapp.com",
      databaseURL: "https://lecture-dashboard-e3e86-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "lecture-dashboard-e3e86",
      storageBucket: "lecture-dashboard-e3e86.firebasestorage.app",
      messagingSenderId: "329153867015",
      appId: "1:329153867015:web:ea43fd013388b464f569a2"
    };
    // ====================================================================

    // ====== 강의자 인증 ======
    //
    // 두 가지 방식을 지원합니다. 지금은 2번(Google 로그인)이 켜져 있습니다.
    //
    // 1) 비밀번호 (AUTH.enabled = false) — 지금까지의 방식.
    //    브라우저 안에서만 검사하므로 개발자도구로 우회할 수 있고,
    //    DB는 여전히 누구나 쓸 수 있습니다. "실수 방지"이지 보안이 아닙니다.
    //    숨긴 글도 수강생 브라우저로 전송된 뒤 화면에서만 걸러집니다.
    //
    // 2) Google 로그인 (AUTH.enabled = true) — 권장.
    //    DB 규칙이 강의자 uid만 쓰기를 허용하고, 숨긴 글은 강의자만 읽을 수 있는
