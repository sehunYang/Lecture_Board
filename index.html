<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 보드</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script>
    /* 테마 적용은 Firebase 모듈이 아니라 여기서 한다.
       모듈은 gstatic import 해석까지 실행이 지연되고, 사내망에서 차단되면 아예 실행되지 않는다. */
    (function () {
      var r = document.documentElement, s = null;
      try { s = localStorage.getItem("theme"); } catch (e) {}
      if (s) r.dataset.theme = s;
      else if (matchMedia("(prefers-color-scheme:dark)").matches) r.dataset.theme = "dark";
      /* 토글도 여기서 위임 처리한다. 모듈에 두면 gstatic 차단 시 버튼이 죽는다. */
      document.addEventListener("click", function (e) {
        var b = e.target && e.target.closest && e.target.closest("#theme-toggle");
        if (!b) return;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("theme", r.dataset.theme); } catch (err) {}
      });
    })();
  </script>
  <style>
    /* ==========================================================================
       PORTABLE: TOKENS + PRIMITIVES
       source: sehunYang.github.io/css/main.css (대조 2026-07-28)
       다른 프로젝트로 디자인을 통일할 때는 이 블록만 복사하면 출발점이 됩니다.
       아래 "APP-SPECIFIC" 구획 위쪽까지가 이식 대상입니다.

       ⚠️ 기준과의 의도적 이탈 — .button
          기준의 .button은 accent 채움(filled)입니다.
          이 파일은 .button을 기존 버튼 7곳에 "덧붙이는" 방식이라, 채움을 그대로 쓰면
          칩·삭제·자세히까지 전부 accent 파랑이 됩니다.
          그래서 여기서는  .button = 중립(outlined),  채움은 .btn-primary 가 담당합니다.
          → 이 블록을 기준 사이트의 마크업과 함께 쓰지 마세요. 버튼이 잘못 보입니다.
          → 장기적으로는 양쪽을 .button=채움 / .button.ghost=중립 으로 맞추는 것이 맞습니다.

       ⚠️ .button 과 .btn-primary 는 CSS 특이성이 같습니다(0,1,0).
          반드시 이 PORTABLE 블록이 APP-SPECIFIC 보다 "앞"에 와야 합니다.
       ========================================================================== */
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --text: #171717;
      --muted: #666666;
      --line: #d9d9d4;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #111210;
      --surface: #191a18;
      --text: #f2f2ed;
      --muted: #a8aaa2;
      --line: #343630;
      --accent: #7db1ff;
      --accent-soft: #172a46;
    }

    * { box-sizing: border-box; }
    html {
      /* 기준 사이트의 본문 스케일 17px. body가 아니라 html에 지정해야 한다 —
         이 파일의 크기 선언은 전부 rem이고 rem은 루트 기준이다. */
      font-size: 17px;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.7;
      letter-spacing: -0.01em;
      -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3 { line-height: 1.2; letter-spacing: -0.04em; }
    button { font: inherit; }

    /* --- 프리미티브: 버튼 (기준 main.css의 .button / .icon-button) --- */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .button.secondary { background: var(--surface); color: var(--accent); }
    .icon-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      width: 2.5rem;
      height: 2.5rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* --- 프리미티브: 안내 박스 (기준 main.css의 .notice) --- */
    .notice {
      padding: 1rem;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      color: var(--text);
    }

    /* --- 프리미티브: 토스트 (기준 main.css의 .toast) --- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      z-index: 30;
      translate: -50% 1rem;
      max-width: calc(100vw - 2rem);
      padding: 0.75rem 1.15rem;
      /* 기준은 999px pill이지만 이 앱의 토스트는 복사한 글 미리보기(2줄)를 담는다.
         다줄 콘텐츠와 pill 곡률은 기하학적으로 맞지 않아 14px로 의도적 이탈. */
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, translate 0.2s ease;
    }
    .toast.is-visible { opacity: 1; translate: -50% 0; }

    /* --- 프리미티브: 포커스 링 --- */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ==========================================================================
       APP-SPECIFIC (강의 보드 전용)
       아래부터는 이식 대상이 아닙니다.
       주의: 이 구획은 반드시 PORTABLE 블록 "뒤"에 와야 합니다.
             .button과 .btn-primary는 특이성이 같아(0,1,0) 순서가 승자를 정합니다.
             순서가 뒤집히면 저장 버튼이 회색으로 보이는 무증상 회귀가 납니다.
       ========================================================================== */
    :root {
      /* 기준 토큰 집합에는 없지만 현행 파일에서 승계하는 값 (신규 발명 아님).
         #dc2626 on #ffffff = 4.83:1 (AA 통과) — 라이트는 원값을 그대로 유지한다.
         다크에서는 #dc2626 on #191a18 = 3.62:1 로 AA 실패하므로 아래에서 분리한다. */
      --danger: #dc2626;
      /* accent 위에 얹는 글자색. 기준의 .button{color:#fff}를 그대로 쓰면
         다크에서 #fff on #7db1ff = 2.19:1 로 AA 실패하므로 분리한다.
         라이트 #fff on #2563eb = 5.17:1 / 다크 #111210 on #7db1ff = 8.59:1 */
      --on-accent: #ffffff;
      --bubble-hidden-opacity: 0.55;
    }
    [data-theme="dark"] {
      /* #dc2626 on #191a18 = 3.62:1 (AA 실패) → #f87171 = 6.31:1 */
      --danger: #f87171;
      --on-accent: #111210;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem 1rem 5rem;
    }

    /* Header — 기준 .site-header 를 따라 full-bleed sticky.
       .wrap 안에 두면 폭이 820px로 갇혀 블러 패널과 하단선이 화면 중간에서 끊긴다. */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem max(1rem, calc((100vw - 820px) / 2));
      /* color-mix 미지원 브라우저에서는 아래 선언이 파싱 단계에서 폐기되어
         transparent가 되므로, 불투명 폴백을 먼저 선언한다. */
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .site-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
      color: var(--text);
    }
    .site-header .header-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    button {
      /* font-family는 위 PORTABLE의 button{font:inherit}가 이미 처리한다. */
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.95rem;
      padding: 0.45rem 0.9rem;
      background: var(--surface);
      color: var(--text);
      transition: background 0.12s ease, opacity 0.12s ease, border-color 0.12s ease;
    }
    button:hover {
      background: var(--bg);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    button:active { opacity: 0.8; }
    .btn-mode { background: var(--surface); color: var(--accent); font-weight: 700; }
    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      font-weight: 700;
    }
    .btn-primary:hover {
      background: var(--accent);
      background: color-mix(in srgb, var(--accent) 85%, var(--text));
    }
    .btn-danger { color: var(--danger); background: var(--surface); }

    /* Banner — 기준 .notice 패턴 */
    .banner {
      border-radius: 0 10px 10px 0;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
    }
    /* accent on accent-soft은 라이트에서 4.24:1로 AA 미달 — .btn-more와 동일하게 처리한다.
       라이트 #2563eb on #ffffff = 5.17:1 / 다크 #7db1ff on #191a18 = 7.99:1 */
    .banner code {
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .hidden { display: none !important; }

    /* 수업 종류 바 */
    .classbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .classbar .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .chip {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--line);
    }
    .chip:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    /* 선택 상태: 기준의 .sim-tab[aria-selected=true] 패턴(accent-soft + accent 테두리).
       inset 그림자로 테두리를 2px 두께처럼 보이게 해 교실 뒤에서도 식별되게 한다(P3). */
    .chip.active {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      font-weight: 700;
    }
    .chip.active:hover { background: var(--accent-soft); }
    .classbar .cb-tools { display: flex; gap: 0.25rem; margin-left: auto; }
    .classbar .cb-tools button {
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }
    .classbar .cb-tools button:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    .classbar .cb-add { color: var(--accent); font-weight: 700; }
    .class-label { font-size: 0.92rem; color: var(--muted); }
    .class-label b { color: var(--accent); font-weight: 700; }

    select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
    }

    /* Composer (teacher) */
    .composer { margin-bottom: 1.4rem; }
    .composer textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      font-family: inherit;
      font-size: 1.15rem;
      line-height: 1.5;
      padding: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
    }
    .composer .cat-row { display: flex; align-items: center; gap: 0.5rem; }
    .composer .cat-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .composer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }
    .bulk-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

    /* Bubbles */
    .list { display: flex; flex-direction: column; gap: 0.85rem; }
    .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
    }
    .bubble.is-hidden {
      border-style: dashed;
      opacity: var(--bubble-hidden-opacity);
    }
    /* 수강생 화면: 버블 전체가 복사 버튼 역할 */
    .bubble.copyable { cursor: pointer; }
    .bubble.copyable:hover { border-color: var(--accent); }
    .bubble.copyable:active { opacity: 0.85; }
    .bubble .content { flex: 1; min-width: 0; }
    .bubble .text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 1.5rem;
      line-height: 1.55;
      letter-spacing: -0.01em;
      user-select: text;
      -webkit-user-select: text;
    }
    /* 3줄 초과 시 ... 처리 */
    .bubble .text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* accent 글자를 accent-soft 위에 얹으면 라이트에서 4.24:1로 AA 미달이다.
       배경을 surface로 두고 테두리로 accent 정체성을 유지한다.
       라이트 #2563eb on #ffffff = 5.17:1 / 다크 #7db1ff on #191a18 = 7.99:1 */
    .bubble .btn-more {
      margin-top: 0.5rem;
      padding: 0.2rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
    }
    .bubble .btn-more:hover {
      background: var(--surface);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    }
    .bubble .cat-tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .bubble .cat-select { margin-top: 0.55rem; font-size: 0.8rem; padding: 0.25rem 0.55rem; }
    .bubble .content-foot { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .bubble .num {
      flex-shrink: 0;
      min-width: 1.5em;
      text-align: right;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .bubble .time {
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .bubble .actions {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .bubble .actions button { padding: 0.35rem 0.75rem; font-size: 0.9rem; white-space: nowrap; }
    .bubble .reorder {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .bubble .reorder button {
      padding: 0.3rem 0.7rem;
      font-size: 1rem;
      line-height: 1;
      font-weight: 700;
    }
    .bubble .reorder button:disabled { opacity: 0.3; cursor: default; }
    .bubble.editing { flex-direction: column; }
    .bubble .edit-area {
      width: 100%;
      min-height: 90px;
      font-family: inherit;
      font-size: 1.4rem;
      line-height: 1.5;
      padding: 0.7rem;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }
    .bubble .edit-row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.6rem; width: 100%; }

    .empty { color: var(--muted); text-align: center; padding: 3rem 0; font-size: 1.05rem; }

    /* Profile editor (teacher only) */
    .profile-editor {
      margin-top: 2.2rem;
      padding: 0.7rem 1.1rem;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }
    .pf-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.35rem 0;
    }
    .pf-toggle:hover { background: transparent; opacity: 0.8; }
    .pf-toggle .pf-icon { font-size: 0.8rem; }
    .pf-body { margin-top: 0.7rem; }
    .profile-editor label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .profile-editor input,
    .profile-editor textarea {
      width: 100%;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
    }
    .profile-editor textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }
    .profile-editor .pe-row { display: flex; justify-content: flex-end; }

    /* Profile card (footer, everyone) */
    .profile-footer {
      margin-top: 2.4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }
    .profile-footer .pf-name { font-weight: 600; }
    .profile-footer .pf-contact-label { margin-top: 4px; font-weight: 600; }
    .profile-footer .pf-contact {
      white-space: pre-line;
      padding-left: 8px;
      border-left: 2px solid var(--line);
      margin-top: 2px;
    }
    .profile-footer .pf-copy { margin-top: 6px; font-size: 0.72rem; opacity: 0.9; }

    /* 강의자 비밀번호 다이얼로그 */
    .pw-dialog {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      padding: 1.5rem 1.6rem 1.3rem;
      min-width: min(21rem, calc(100vw - 2.5rem));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }
    .pw-dialog::backdrop { background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px); }
    .pw-title { font-size: 1.15rem; font-weight: 800; margin: 0 0 1rem; }
    .pw-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    .pw-input {
      width: 100%;
      font-family: inherit;
      font-size: 1.3rem;
      letter-spacing: 0.25em;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    .pw-error {
      min-height: 1.3rem;
      margin: 0.45rem 0 0;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--danger);
    }
    .pw-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.6rem; }

    /* Toast 내부 (복사 완료 알림) */
    .toast .toast-msg { display: block; font-size: 0.95rem; }
    .toast .toast-preview {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
      font-size: 0.8rem;
      opacity: 0.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 700px) {
      html { font-size: 16px; }
    }

    @media (max-width: 560px) {
      .bubble { flex-direction: row; flex-wrap: wrap; }
      .bubble .content { flex-basis: 100%; order: 2; }
      .bubble .text { font-size: 1.3rem; }
      .bubble .num { order: 1; }
      .bubble .time { order: 3; padding-top: 0; }
      .bubble .actions { order: 4; flex-direction: row; flex-wrap: wrap; }
      .bubble .reorder { order: 5; flex-direction: row; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 id="title">강의 보드</h1>
    <div class="header-tools">
      <button id="modeToggle" class="btn-mode button secondary">강의자 모드</button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="색상 모드 전환">◐</button>
    </div>
  </header>
  <div class="wrap">

    <div id="setupBanner" class="banner notice hidden">
      ⚠️ Firebase 설정이 아직 안 됐습니다. <code>index.html</code> 상단 <code>firebaseConfig</code> 값을
      본인 프로젝트 값으로 교체하세요. 방법은 <code>README.md</code> 참고.
    </div>

    <!-- 수업 종류 선택 바 (강의자: 선택·추가·수정, 수강생: 현재 수업 표시) -->
    <div id="classBar" class="classbar hidden"></div>

    <!-- 강의자 전용 작성 영역 -->
    <div id="teacherComposer" class="composer hidden">
      <textarea id="input" placeholder="여기에 글을 적고 저장하세요 (여러 줄 가능)"></textarea>
      <div class="composer-row">
        <div class="cat-row">
          <label for="msgCategory">수업 종류</label>
          <select id="msgCategory"></select>
        </div>
        <button id="saveBtn" class="btn-primary button">저장</button>
      </div>
      <div class="bulk-row">
        <button id="hideAllBtn">모두 숨기기</button>
        <button id="showAllBtn">모두 보이기</button>
      </div>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty hidden">아직 표시된 글이 없습니다.</div>

    <!-- 강의자 전용 프로필 편집 (강의자 모드 맨 아래) -->
    <div id="profileEditor" class="profile-editor hidden">
      <button id="pfToggle" class="pf-toggle" type="button" aria-expanded="false" aria-controls="pfBody">
        <span>프로필 카드 편집</span>
        <span id="pfIcon" class="pf-icon">▸</span>
      </button>
      <div id="pfBody" class="pf-body hidden">
        <label for="pfName">이름</label>
        <input id="pfName" type="text" placeholder="이름" autocomplete="off" />
        <label for="pfAffiliation">소속</label>
        <input id="pfAffiliation" type="text" placeholder="소속" autocomplete="off" />
        <label for="pfContact">Contact (여러 줄 입력 가능 — SNS, 이메일 등)</label>
        <textarea id="pfContact" placeholder="예)&#10;Email: name@example.com&#10;Instagram: @handle"></textarea>
        <div class="pe-row">
          <button id="pfSaveBtn" class="btn-primary button">프로필 저장</button>
        </div>
      </div>
    </div>

    <!-- 프로필 카드 (양쪽 화면 공통 푸터) -->
    <footer id="profileCard" class="profile-footer hidden"></footer>
  </div>

  <!-- 복사 완료 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <b class="toast-msg">복사되었습니다</b>
    <span id="toastPreview" class="toast-preview" aria-hidden="true"></span>
  </div>

  <!-- 강의자 비밀번호 입력 (화면 공유 중 노출 방지를 위해 type=password 사용) -->
  <dialog id="pwDialog" class="pw-dialog" aria-labelledby="pwTitle">
    <form id="pwForm" method="dialog">
      <h2 id="pwTitle" class="pw-title">강의자 모드</h2>
      <label class="pw-label" for="pwInput">비밀번호</label>
      <input id="pwInput" class="pw-input" type="password" inputmode="numeric"
             autocomplete="current-password" placeholder="••••" />
      <p id="pwError" class="pw-error" role="alert"></p>
      <div class="pw-actions">
        <button type="button" id="pwCancel" class="button">취소</button>
        <button type="submit" id="pwSubmit" class="btn-primary button">확인</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, update, remove, get, child
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ====== Firebase 설정 (본인 값으로 교체하세요 — README.md 참고) ======
    const firebaseConfig = {
      apiKey: "AIzaSyAKrNGCO-9vvtO6vM-NK_atwKl4OAmmtCw",
      authDomain: "lecture-dashboard-e3e86.firebaseapp.com",
      databaseURL: "https://lecture-dashboard-e3e86-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "lecture-dashboard-e3e86",
      storageBucket: "lecture-dashboard-e3e86.firebasestorage.app",
      messagingSenderId: "329153867015",
      appId: "1:329153867015:web:ea43fd013388b464f569a2"
    };
    // ====================================================================

    // ====== 강의자 비밀번호 ======
    // 평문을 두지 않습니다. PBKDF2-SHA256(310,000회) 해시만 저장합니다.
    // 비밀번호를 바꾸려면 README의 "비밀번호 변경" 절차를 따르세요.
    //
    // ⚠️ 한계를 분명히 알아두세요. 이 파일은 공개된 정적 페이지라
    //    브라우저 개발자도구로 이 검사를 우회하는 것은 언제든 가능합니다.
    //    이 잠금은 "실수 방지"이지 보안이 아닙니다.
    //    실제 데이터 보호는 Firebase 보안 규칙이 담당합니다.
    const TEACHER_AUTH = {
      salt: "926473cda3686406de178c00e1077e60",
      iterations: 310000,
      hash: "887a1f80783e8e415cc2de4dbc607f5f29a239b6d8700ced0d20f91c681ec046"
    };

    const hexToBytes = (hex) =>
      new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
    const bytesToHex = (buf) =>
      [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

    async function verifyTeacherPassword(pw) {
      if (!(window.crypto && crypto.subtle)) return null;   // 판정 불가 (비보안 컨텍스트)
      const key = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: hexToBytes(TEACHER_AUTH.salt),
          iterations: TEACHER_AUTH.iterations, hash: "SHA-256" },
        key, 256
      );
      return bytesToHex(bits) === TEACHER_AUTH.hash;
    }
    const DB_PATH = "rooms/default/messages";
    const PROFILE_PATH = "rooms/default/profile";
    const CATEGORIES_PATH = "rooms/default/categories";
    const STATE_PATH = "rooms/default/state";

    const configured = firebaseConfig.apiKey !== "YOUR_API_KEY";
    let db = null, messagesRef = null, profileRef = null, categoriesRef = null, stateRef = null;
    if (configured) {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      messagesRef = ref(db, DB_PATH);
      profileRef = ref(db, PROFILE_PATH);
      categoriesRef = ref(db, CATEGORIES_PATH);
      stateRef = ref(db, STATE_PATH);
    } else {
      document.getElementById("setupBanner").classList.remove("hidden");
    }

    // ---- State ----
    let messages = [];            // [{id, text, createdAt, hidden, categoryId}]
    let categories = [];          // [{id, name, createdAt, order}]
    let activeCategory = "";      // "" = 전체 보기 (강의자·수강생 화면 공통, DB로 동기화)
    let mode = "student";         // 'student' | 'teacher'
    let editingId = null;
    const expanded = new Set();   // 3줄 클램프를 펼쳐둔 메시지 id
    let renderToken = 0;          // 겹친 렌더의 지연 측정 무효화용
    let profile = { name: "", affiliation: "", contact: "" };

    // ---- Elements ----
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const composerEl = document.getElementById("teacherComposer");
    const modeToggle = document.getElementById("modeToggle");
    const titleEl = document.getElementById("title");
    const inputEl = document.getElementById("input");
    const classBarEl = document.getElementById("classBar");
    const msgCategoryEl = document.getElementById("msgCategory");
    const profileEditorEl = document.getElementById("profileEditor");
    const profileCardEl = document.getElementById("profileCard");
    const pfNameEl = document.getElementById("pfName");
    const pfAffiliationEl = document.getElementById("pfAffiliation");
    const pfContactEl = document.getElementById("pfContact");
    const pfToggleEl = document.getElementById("pfToggle");
    const pfBodyEl = document.getElementById("pfBody");
    const pfIconEl = document.getElementById("pfIcon");

    // ---- Mode ----
    // 비밀번호는 window.prompt가 아니라 type=password 다이얼로그로 받는다.
    // prompt는 입력한 글자가 그대로 보여서, 화면 공유 중이면 송출 화면에 노출된다.
    const pwDialogEl = document.getElementById("pwDialog");
    const pwFormEl = document.getElementById("pwForm");
    const pwInputEl = document.getElementById("pwInput");
    const pwErrorEl = document.getElementById("pwError");
    const pwSubmitEl = document.getElementById("pwSubmit");

    function openPasswordDialog() {
      pwInputEl.value = "";
      pwErrorEl.textContent = "";
      pwSubmitEl.disabled = false;
      pwDialogEl.showModal();
      pwInputEl.focus();
    }
    document.getElementById("pwCancel").addEventListener("click", () => pwDialogEl.close());
    // 닫힐 때 입력값을 남기지 않는다 (다음에 열었을 때 잔상 방지)
    pwDialogEl.addEventListener("close", () => { pwInputEl.value = ""; });

    pwFormEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = pwInputEl.value;
      if (!pw) { pwErrorEl.textContent = "비밀번호를 입력하세요."; return; }
      pwSubmitEl.disabled = true;
      pwErrorEl.textContent = "확인 중…";
      const ok = await verifyTeacherPassword(pw);
      if (ok === null) {
        pwErrorEl.textContent = "이 환경에서는 확인할 수 없습니다. https 주소로 접속해 주세요.";
        pwSubmitEl.disabled = false;
        return;
      }
      if (!ok) {
        pwErrorEl.textContent = "비밀번호가 올바르지 않습니다.";
        pwInputEl.value = "";
        pwInputEl.focus();
        pwSubmitEl.disabled = false;
        return;
      }
      // 입력값을 DOM에 남기지 않는다 (close 이벤트 타이밍에 의존하지 않도록 명시적으로)
      pwInputEl.value = "";
      pwErrorEl.textContent = "";
      pwDialogEl.close();
      mode = "teacher";
      location.hash = "teacher";
      applyMode();
    });

    function enterTeacher() { openPasswordDialog(); }
    function exitTeacher() {
      mode = "student";
      editingId = null;
      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
      applyMode();
    }
    function applyMode() {
      const teacher = mode === "teacher";
      composerEl.classList.toggle("hidden", !teacher);
      profileEditorEl.classList.toggle("hidden", !teacher);
      modeToggle.textContent = teacher ? "수강생 화면으로" : "강의자 모드";
      titleEl.textContent = teacher ? "강의 보드 · 강의자" : "강의 보드";
      if (teacher) { fillProfileInputs(); syncComposerCategory(); }
      renderClassBar();
      render();
    }
    modeToggle.addEventListener("click", () => (mode === "teacher" ? exitTeacher() : enterTeacher()));

    // ---- 수업 종류 (categories) ----
    function sortCategories(arr) {
      return [...arr].sort((a, b) =>
        (a.order - b.order) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : 1)
      );
    }
    function categoryName(id) {
      const c = categories.find(x => x.id === id);
      return c ? c.name : "";
    }
    function addCategory() {
      if (!configured) return alert("Firebase 설정이 필요합니다. README.md를 확인하세요.");
      const name = (window.prompt("추가할 수업 종류의 이름을 입력하세요") || "").trim();
      if (!name) return;
      if (categories.some(c => c.name === name)) return alert("같은 이름의 수업 종류가 이미 있습니다.");
      const now = Date.now();
      const created = push(categoriesRef, { name, createdAt: now, order: now });
      setActiveCategory(created.key);   // 새로 만든 수업을 바로 선택
    }
    function renameCategory(id) {
      const c = categories.find(x => x.id === id);
      if (!c) return;
      const name = (window.prompt("수업 종류 이름을 수정하세요", c.name) || "").trim();
      if (!name || name === c.name) return;
      if (categories.some(x => x.id !== id && x.name === name)) return alert("같은 이름의 수업 종류가 이미 있습니다.");
      update(ref(db, `${CATEGORIES_PATH}/${id}`), { name });
    }
    function deleteCategory(id) {
      const c = categories.find(x => x.id === id);
      if (!c) return;
      const affected = messages.filter(m => m.categoryId === id);
      const msg = affected.length
        ? `'${c.name}' 수업 종류를 삭제할까요?\n이 수업의 글 ${affected.length}개는 삭제되지 않고 '미분류'로 이동합니다.`
        : `'${c.name}' 수업 종류를 삭제할까요?`;
      if (!confirm(msg)) return;
      if (affected.length) {
        const updates = {};
        affected.forEach(m => { updates[`${m.id}/categoryId`] = ""; });
        update(messagesRef, updates);
      }
      remove(ref(db, `${CATEGORIES_PATH}/${id}`));
      setActiveCategory("");
    }
    // 선택된 수업은 DB에 저장 → 수강생 화면도 같은 수업만 보게 됨
    function setActiveCategory(id) {
      if (!configured) return;
      update(stateRef, { activeCategory: id || "" });
    }
    // 강의자 화면의 수업 종류 바 / 수강생 화면의 현재 수업 표시
    function renderClassBar() {
      const teacher = mode === "teacher";
      classBarEl.innerHTML = "";

      if (!teacher) {
        const name = categoryName(activeCategory);
        classBarEl.classList.toggle("hidden", !name);
        if (!name) return;
        const label = document.createElement("div");
        label.className = "class-label";
        const strong = document.createElement("b");
        strong.textContent = name;
        label.append("현재 수업: ", strong);
        classBarEl.appendChild(label);
        return;
      }

      classBarEl.classList.remove("hidden");
      const chips = document.createElement("div");
      chips.className = "chips";
      const makeChip = (id, name) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip button" + (activeCategory === id ? " active" : "");
        b.textContent = name;
        b.addEventListener("click", () => setActiveCategory(id));
        return b;
      };
      chips.appendChild(makeChip("", "전체"));
      sortCategories(categories).forEach(c => chips.appendChild(makeChip(c.id, c.name)));
      classBarEl.appendChild(chips);

      const tools = document.createElement("div");
      tools.className = "cb-tools";
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "cb-add";
      addBtn.textContent = "+ 수업 추가";
      addBtn.addEventListener("click", addCategory);
      tools.appendChild(addBtn);
      if (activeCategory && categoryName(activeCategory)) {
        const renBtn = document.createElement("button");
        renBtn.type = "button";
        renBtn.textContent = "이름 변경";
        renBtn.addEventListener("click", () => renameCategory(activeCategory));
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-danger button";
        delBtn.textContent = "수업 삭제";
        delBtn.addEventListener("click", () => deleteCategory(activeCategory));
        tools.append(renBtn, delBtn);
      }
      classBarEl.appendChild(tools);
    }
    // select 요소에 '미분류' + 수업 종류 목록 채우기
    function fillCategorySelect(sel, value) {
      sel.innerHTML = "";
      const none = document.createElement("option");
      none.value = "";
      none.textContent = "미분류";
      sel.appendChild(none);
      sortCategories(categories).forEach(c => {
        const o = document.createElement("option");
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });
      sel.value = categories.some(c => c.id === value) ? value : "";
    }
    // 작성창의 수업 선택: 선택된 수업이 바뀌면 그 수업으로 따라가고, 그 외엔 강의자 선택을 유지
    let composerSyncedTo = null;
    function syncComposerCategory() {
      // 선택된 수업이 아직 목록에 안 들어온 상태(초기 로딩)에서는 동기화를 미룬다
      const known = !activeCategory || categories.some(c => c.id === activeCategory);
      const follow = known && composerSyncedTo !== activeCategory;
      if (known) composerSyncedTo = activeCategory;
      fillCategorySelect(msgCategoryEl, follow ? activeCategory : msgCategoryEl.value);
    }

    // ---- Data ops ----
    function saveMessage() {
      if (!configured) return alert("Firebase 설정이 필요합니다. README.md를 확인하세요.");
      const text = inputEl.value.trim();
      if (!text) return;
      const now = Date.now();
      const categoryId = msgCategoryEl.value || "";
      push(messagesRef, { text, createdAt: now, updatedAt: now, hidden: false, order: now, categoryId });
      inputEl.value = "";
      inputEl.focus();
    }
    function setMessageCategory(id, categoryId) {
      update(ref(db, `${DB_PATH}/${id}`), { categoryId: categoryId || "" });
    }
    function updateText(id, text) {
      update(ref(db, `${DB_PATH}/${id}`), { text, updatedAt: Date.now() });
    }
    function setHidden(id, hidden) {
      update(ref(db, `${DB_PATH}/${id}`), { hidden });
    }
    function deleteMessage(id) {
      if (!confirm("이 글을 삭제할까요?")) return;
      remove(ref(db, `${DB_PATH}/${id}`));
    }
    // 일괄 숨기기/보이기는 지금 선택된 수업의 글에만 적용
    function setAllHidden(hidden) {
      const targets = messages.filter(matchesActiveCategory);
      if (!targets.length) return;
      const updates = {};
      targets.forEach(m => { updates[`${m.id}/hidden`] = hidden; });
      update(messagesRef, updates);
    }
    // activeCategory가 ""(전체)면 모두 통과, 아니면 해당 수업의 글만
    function matchesActiveCategory(m) {
      return !activeCategory || m.categoryId === activeCategory;
    }
    // 현재 화면에 실제로 보이는 목록 (모드 + 선택된 수업 기준, 정렬 완료)
    function visibleMessages() {
      const teacher = mode === "teacher";
      return sortMessages(messages.filter(m => (teacher || !m.hidden) && matchesActiveCategory(m)));
    }
    // 정렬 기준값(order 없으면 createdAt로 대체)
    function effOrder(m) {
      return (m.order !== undefined && m.order !== null) ? m.order : m.createdAt;
    }
    // dir: -1 = 위로, +1 = 아래로 (현재 보이는 목록 기준으로 이웃과 order 교환)
    function moveMessage(id, dir) {
      const sorted = visibleMessages();
      const i = sorted.findIndex(m => m.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= sorted.length) return;
      const a = sorted[i], b = sorted[j];
      update(messagesRef, {
        [`${a.id}/order`]: effOrder(b),
        [`${b.id}/order`]: effOrder(a)
      });
    }
    // 최신/상단 우선(order 내림차순), 동률이면 createdAt·id로 안정 정렬
    function sortMessages(arr) {
      return [...arr].sort((a, b) =>
        (effOrder(b) - effOrder(a)) ||
        (b.createdAt - a.createdAt) ||
        (a.id < b.id ? 1 : -1)
      );
    }

    document.getElementById("saveBtn").addEventListener("click", saveMessage);
    document.getElementById("hideAllBtn").addEventListener("click", () => setAllHidden(true));
    document.getElementById("showAllBtn").addEventListener("click", () => setAllHidden(false));
    inputEl.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") saveMessage();
    });

    // ---- Profile ----
    function fillProfileInputs() {
      // 편집 중(포커스)인 칸은 덮어쓰지 않음
      if (document.activeElement !== pfNameEl) pfNameEl.value = profile.name || "";
      if (document.activeElement !== pfAffiliationEl) pfAffiliationEl.value = profile.affiliation || "";
      if (document.activeElement !== pfContactEl) pfContactEl.value = profile.contact || "";
    }
    function saveProfile() {
      if (!configured) return alert("Firebase 설정이 필요합니다. README.md를 확인하세요.");
      update(profileRef, {
        name: pfNameEl.value.trim(),
        affiliation: pfAffiliationEl.value.trim(),
        contact: pfContactEl.value.trim()
      });
      const btn = document.getElementById("pfSaveBtn");
      const original = btn.textContent;
      btn.textContent = "저장됨";
      btn.disabled = true;
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1000);
    }
    function renderProfile() {
      const has = !!(profile.name || profile.affiliation || profile.contact);
      profileCardEl.classList.toggle("hidden", !has);
      profileCardEl.innerHTML = "";
      if (!has) return;
      if (profile.name) {
        const d = document.createElement("div");
        d.className = "pf-name";
        d.textContent = profile.name;
        profileCardEl.appendChild(d);
      }
      if (profile.affiliation) {
        const d = document.createElement("div");
        d.textContent = profile.affiliation;
        profileCardEl.appendChild(d);
      }
      if (profile.contact) {
        const label = document.createElement("div");
        label.className = "pf-contact-label";
        label.textContent = "Contact";
        const d = document.createElement("div");
        d.className = "pf-contact";
        d.textContent = profile.contact;
        profileCardEl.appendChild(label);
        profileCardEl.appendChild(d);
      }
      const year = new Date().getFullYear();
      const who = profile.name ? " " + profile.name : "";
      const c = document.createElement("div");
      c.className = "pf-copy";
      c.textContent = `© ${year}${who} · 비영리 목적의 복사·배포 허용, 상업적 이용 금지 (CC BY-NC)`;
      profileCardEl.appendChild(c);
    }

    document.getElementById("pfSaveBtn").addEventListener("click", saveProfile);
    pfToggleEl.addEventListener("click", () => {
      const collapsed = pfBodyEl.classList.toggle("hidden");
      pfIconEl.textContent = collapsed ? "▸" : "▾";
      pfToggleEl.setAttribute("aria-expanded", String(!collapsed));
    });

    // ---- Clipboard + 복사 완료 토스트 ----
    const toastEl = document.getElementById("toast");
    const toastPreviewEl = document.getElementById("toastPreview");
    let toastTimer = null;

    function showToast(text) {
      // 고정 문구만 스크린리더에 읽히고, 미리보기는 aria-hidden으로 눈에만 보인다.
      toastPreviewEl.textContent = text;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 2400);
    }
    function hideToast() {
      clearTimeout(toastTimer);
      toastEl.classList.remove("is-visible");
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch {}
        document.body.removeChild(ta);
      }
      showToast(text);
    }

    // ---- Time formatting ----
    const pad2 = (n) => String(n).padStart(2, "0");
    // 강의자용 절대시간: MM-DD HH:MM
    function formatAbsolute(ts) {
      const d = new Date(ts);
      return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    // 수강생용 상대시간: 최대 단위만 표기 (초/분/시간/일/월/년 전)
    function formatRelative(ts) {
      const sec = Math.floor(Math.max(0, Date.now() - ts) / 1000);
      if (sec < 60) return pad2(sec) + "초 전";
      const min = Math.floor(sec / 60);
      if (min < 60) return pad2(min) + "분 전";
      const hr = Math.floor(min / 60);
      if (hr < 24) return pad2(hr) + "시간 전";
      const day = Math.floor(hr / 24);
      if (day < 30) return pad2(day) + "일 전";
      const month = Math.floor(day / 30);
      if (month < 12) return pad2(month) + "월 전";
      return pad2(Math.floor(month / 12)) + "년 전";
    }
    // 수강생 화면 상대시간 라벨을 주기적으로 갱신(재렌더 없이)
    function updateRelativeTimes() {
      document.querySelectorAll('#list .time[data-rel]').forEach(el => {
        el.textContent = formatRelative(Number(el.dataset.ts));
      });
    }
    setInterval(updateRelativeTimes, 1000);

    // ---- Render ----
    function render() {
      const teacher = mode === "teacher";
      // 수강생: 숨김 제외. 강의자: 전부. order 기준 상단 우선.
      // 선택된 수업 종류가 있으면 양쪽 모두 그 수업의 글만.
      const visible = visibleMessages();

      listEl.innerHTML = "";
      emptyEl.classList.toggle("hidden", visible.length > 0);
      const activeName = categoryName(activeCategory);
      emptyEl.textContent = activeName
        ? `'${activeName}' 수업에 표시된 글이 없습니다.`
        : "아직 표시된 글이 없습니다.";

      const clampTargets = [];   // [{id, textEl, moreBtn}] — 렌더 후 넘침 여부 측정

      visible.forEach((m, idx) => {
        const bubble = document.createElement("div");
        bubble.className = "bubble" + (m.hidden ? " is-hidden" : "");

        // 왼쪽 순서 번호 (표시되는 목록 기준 — 수강생은 숨김 제외 후 재부여)
        const numEl = document.createElement("div");
        numEl.className = "num";
        numEl.textContent = String(idx + 1);

        if (teacher && editingId === m.id) {
          bubble.classList.add("editing");
          const ta = document.createElement("textarea");
          ta.className = "edit-area";
          ta.value = m.text;
          const row = document.createElement("div");
          row.className = "edit-row";
          const save = document.createElement("button");
          save.className = "btn-primary button";
          save.textContent = "저장";
          save.addEventListener("click", () => {
            const v = ta.value.trim();
            if (v) updateText(m.id, v);
            editingId = null; render();
          });
          const cancel = document.createElement("button");
          cancel.textContent = "취소";
          cancel.addEventListener("click", () => { editingId = null; render(); });
          row.append(save, cancel);
          bubble.append(ta, row);
          listEl.appendChild(bubble);
          ta.focus();
          return;
        }

        // 본문 + 자세히 버튼 (3줄 초과 시에만 버튼 노출)
        const contentEl = document.createElement("div");
        contentEl.className = "content";

        const textEl = document.createElement("div");
        textEl.className = "text clamped";
        textEl.textContent = m.text;

        const moreBtn = document.createElement("button");
        moreBtn.type = "button";
        moreBtn.className = "btn-more button hidden";
        moreBtn.textContent = "자세히";
        moreBtn.addEventListener("click", (e) => {
          e.stopPropagation();   // 버블 클릭(복사)과 분리
          const isExpanded = expanded.has(m.id);
          if (isExpanded) expanded.delete(m.id); else expanded.add(m.id);
          textEl.classList.toggle("clamped", isExpanded);
          moreBtn.textContent = isExpanded ? "자세히" : "접기";
        });

        contentEl.append(textEl, moreBtn);
        clampTargets.push({ id: m.id, textEl, moreBtn });

        // 수업 종류: 강의자는 셀렉트로 변경, 수강생은 '전체' 상태일 때만 배지로 표시
        const foot = document.createElement("div");
        foot.className = "content-foot";
        if (teacher) {
          const catSel = document.createElement("select");
          catSel.className = "cat-select";
          fillCategorySelect(catSel, m.categoryId);
          catSel.addEventListener("click", (e) => e.stopPropagation());
          catSel.addEventListener("change", () => setMessageCategory(m.id, catSel.value));
          foot.appendChild(catSel);
        } else if (!activeCategory && categoryName(m.categoryId)) {
          const tag = document.createElement("span");
          tag.className = "cat-tag";
          tag.textContent = categoryName(m.categoryId);
          foot.appendChild(tag);
        }
        if (foot.childElementCount) contentEl.appendChild(foot);

        // 버튼 왼쪽 작은 시간 표기 (강의자=절대시간, 수강생=상대시간)
        const timeEl = document.createElement("div");
        timeEl.className = "time";
        if (teacher) {
          timeEl.textContent = formatAbsolute(m.updatedAt);
        } else {
          timeEl.textContent = formatRelative(m.updatedAt);
          timeEl.dataset.ts = String(m.updatedAt);
          timeEl.dataset.rel = "1";
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        if (teacher) {
          const editBtn = document.createElement("button");
          editBtn.textContent = "수정";
          editBtn.addEventListener("click", () => { editingId = m.id; render(); });

          const hideBtn = document.createElement("button");
          hideBtn.textContent = m.hidden ? "보이기" : "숨기기";
          hideBtn.addEventListener("click", () => setHidden(m.id, !m.hidden));

          const delBtn = document.createElement("button");
          delBtn.className = "btn-danger button";
          delBtn.textContent = "삭제";
          delBtn.addEventListener("click", () => deleteMessage(m.id));

          actions.append(editBtn, hideBtn, delBtn);

          // 오른쪽 위/아래 순서 변경 버튼
          const reorder = document.createElement("div");
          reorder.className = "reorder";
          const upBtn = document.createElement("button");
          upBtn.textContent = "▲";
          upBtn.title = "위로";
          upBtn.disabled = idx === 0;
          upBtn.addEventListener("click", () => moveMessage(m.id, -1));
          const downBtn = document.createElement("button");
          downBtn.textContent = "▼";
          downBtn.title = "아래로";
          downBtn.disabled = idx === visible.length - 1;
          downBtn.addEventListener("click", () => moveMessage(m.id, 1));
          reorder.append(upBtn, downBtn);

          bubble.append(numEl, contentEl, timeEl, actions, reorder);
        } else {
          // 복사 버튼 없음 — 버블 자체를 클릭하면 복사
          bubble.classList.add("copyable");
          bubble.title = "클릭하면 복사됩니다";
          bubble.addEventListener("click", () => {
            // 텍스트를 직접 선택(드래그)한 경우엔 복사 동작을 건너뜀
            const sel = window.getSelection();
            if (sel && !sel.isCollapsed && bubble.contains(sel.anchorNode)) return;
            copyText(m.text);
          });

          bubble.append(numEl, contentEl, timeEl);
        }

        listEl.appendChild(bubble);
      });

      // 붙인 직후 동기 측정 — 3줄을 넘칠 때만 '자세히' 노출, 펼쳐둔 항목은 상태 복원.
      // (rAF를 쓰면 탭이 백그라운드일 때 프레임이 안 와서 버튼이 안 나타남)
      applyClamp(clampTargets);
      // 웹폰트가 늦게 적용되면 줄 수가 달라질 수 있어 한 번 더 측정
      const token = ++renderToken;
      // Pretendard dynamic-subset은 unicode-range별 지연 로드라 첫 렌더 시점에
      // fonts.status가 "loaded"로 읽힐 수 있다. 조건 없이 항상 재측정한다.
      if (document.fonts) {
        document.fonts.ready.then(() => {
          if (token === renderToken) applyClamp(clampTargets);
        });
      }
    }

    function applyClamp(targets) {
      targets.forEach(({ id, textEl, moreBtn }) => {
        if (!textEl.isConnected) return;
        const isExpanded = expanded.has(id);
        // 넘침 여부는 항상 '접힌 상태'에서 재본다
        if (isExpanded) textEl.classList.add("clamped");
        const overflows = textEl.scrollHeight > textEl.clientHeight + 1;
        if (!overflows) {
          expanded.delete(id);
          moreBtn.classList.add("hidden");
          return;
        }
        moreBtn.classList.remove("hidden");
        if (isExpanded) {
          textEl.classList.remove("clamped");
          moreBtn.textContent = "접기";
        } else {
          moreBtn.textContent = "자세히";
        }
      });
    }

    // ---- Live sync ----
    if (configured) {
      onValue(messagesRef, (snap) => {
        const val = snap.val() || {};
        messages = Object.entries(val).map(([id, v]) => ({
          id,
          text: v.text || "",
          createdAt: v.createdAt || 0,
          hidden: !!v.hidden,
          order: (v.order !== undefined && v.order !== null) ? v.order : (v.createdAt || 0),
          updatedAt: (v.updatedAt !== undefined && v.updatedAt !== null) ? v.updatedAt : (v.createdAt || 0),
          categoryId: v.categoryId || ""
        }));
        render();
      });
      onValue(categoriesRef, (snap) => {
        const val = snap.val() || {};
        categories = Object.entries(val).map(([id, v]) => ({
          id,
          name: v.name || "",
          createdAt: v.createdAt || 0,
          order: (v.order !== undefined && v.order !== null) ? v.order : (v.createdAt || 0)
        }));
        if (mode === "teacher") syncComposerCategory();
        renderClassBar();
        render();
      });
      onValue(stateRef, (snap) => {
        const v = snap.val() || {};
        activeCategory = v.activeCategory || "";
        if (mode === "teacher") syncComposerCategory();
        renderClassBar();
        render();
      });
      onValue(profileRef, (snap) => {
        const v = snap.val() || {};
        profile = { name: v.name || "", affiliation: v.affiliation || "", contact: v.contact || "" };
        renderProfile();
        if (mode === "teacher") fillProfileInputs();
      });
    }

    // ---- Init: honor #teacher (still requires password) ----
    if (location.hash.replace("#", "") === "teacher") {
      enterTeacher();
    }
    applyMode();
  </script>
</body>
</html>
